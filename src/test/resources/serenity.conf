serenity {
    take.screenshots = FOR_EACH_ACTION
    console.colors = true
    logging = VERBOSE
    # 10 segundos de espera por defecto para que aparezcan los elementos (Evita Fake Failures)
    wait.for.timeout = 10000
}

webdriver {
    driver = chrome
    autodownload = true
    # Sincronización explícita del driver con la espera de Serenity
    webdriver.wait.for.timeout = 10000

    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true

        "goog:chromeOptions" {
            args = [
                "headless=new",
                "start-maximized",
                "test-type",
                "no-sandbox",
                "lang=es",
                "disable-popup-blocking",
                "disable-download-notification",
                "ignore-certificate-errors",
                "allow-running-insecure-content",
                "disable-translate",
                "disable-extensions",
                "remote-allow-origins=*",
                "incognito",
                "disable-infobars",
                "disable-gpu",
                "disable-dev-shm-usage",
                "user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            ]
            excludeSwitches = ["enable-logging"]
        }
    }
}

# --- CONFIGURACIÓN DE ENTORNOS (Evolución para tu nuevo proyecto) ---
# Centraliza las URLs aquí en lugar de quemarlas en el código de las Tasks
environments {
    default {
        webdriver.base.url = "https://startsharp.serenity.is/OfficialDemo/" // Sustituye por la URL base real si es otra
    }
    dev {
        webdriver.base.url = "https://startsharp.serenity.is/DevDemo/"
    }
    qa {
        webdriver.base.url = "https://startsharp.serenity.is/QADemo/"
    }
}